name: Greece Performance Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1' # weekly, trend-watching

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run performance tests (single worker)
        run: npx playwright test --project=performance --workers=1
      - name: Performance summary
        if: ${{ !cancelled() }}
        run: |
          node scripts/perf-summary.js | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: performance-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
